<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="darkreader-lock">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="preload" href="/web/admin/oppo-sans-4-6c7d5864c661.ttf" as="font" type="font/ttf" crossorigin>
  <title>SpeedBackup Server</title>
  <link rel="icon" href="/web/admin/server-mark.svg" type="image/svg+xml">
  <script src="/web/admin/preferences.js"></script>
  <script src="/web/admin/request.js"></script>
  <link rel="stylesheet" href="/web/admin/styles.css">
</head>
<body>
  <div id="loginView" class="login-shell">
    <div class="login-card">
      <img class="brand-mark" src="/web/admin/server-mark.svg" alt="SpeedBackup Server">
      <h1>SpeedBackup Server</h1>
      <p class="muted" data-i18n="login_hint"></p>
      <h2 id="loginTitle"></h2>
      <label class="field-label" for="adminUser" data-i18n="admin_user"></label>
      <input id="adminUser" class="input" autocomplete="username" maxlength="48" spellcheck="false">
      <label class="field-label" for="adminPassword" data-i18n="admin_password"></label>
      <input id="adminPassword" class="input" type="password" autocomplete="current-password">
      <div id="confirmPasswordField" class="hidden"><label class="field-label" for="adminConfirm" data-i18n="confirm_password"></label><input id="adminConfirm" class="input" type="password" autocomplete="new-password"></div>
      <button id="loginBtn" class="btn primary wide" data-i18n="login"></button>
      <div id="loginError" class="alert error hidden"></div>
      <div class="login-footer">
        <button class="link-btn locale-btn" data-locale="zh-TW">繁體中文</button>
        <span>·</span>
        <button class="link-btn locale-btn" data-locale="zh-CN">简体中文</button>
      </div>
    </div>
  </div>

  <div id="appView" class="app-shell hidden">
    <aside class="sidebar">
      <div class="brand-row">
        <img class="brand-mark small" src="/web/admin/server-mark.svg" alt="">
        <div><strong>SpeedBackup</strong><div class="tiny muted">Server WebAdmin</div></div>
      </div>
      <nav id="nav">
        <button class="nav-item active" data-page="dashboard"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" focusable="false"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 3v18M9 10h12"/></svg></span><span data-i18n="dashboard"></span></button>
        <button class="nav-item" data-page="profiles"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg></span><span data-i18n="profiles"></span></button>
        <button class="nav-item" data-page="events"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" focusable="false"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></span><span data-i18n="events"></span></button>
        <button class="nav-item" data-page="settings"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M4 7h7m4 0h5M4 17h3m4 0h9"/><circle cx="13" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></span><span data-i18n="settings"></span></button>
      </nav>
      <div class="sidebar-bottom">
        <div id="serverBadge" class="status-chip"><span class="dot ok"></span><span data-i18n="connected"></span></div>
        <button id="logoutBtn" class="btn ghost wide" data-i18n="logout"></button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h2 id="pageTitle"></h2>
          <div id="pageSubtitle" class="muted"></div>
        </div>
        <div class="top-actions">
          <button id="refreshBtn" class="btn ghost" data-i18n="refresh"></button>
          <select id="localeSelect" class="select compact" aria-label="language">
            <option value="zh-TW">繁體中文</option>
            <option value="zh-CN">简体中文</option>
          </select>
        </div>
      </header>
      <section id="content" class="content"></section>
    </main>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/web/admin/dav_config.js" defer></script>
  <script src="/web/admin/dav_monitor.js" defer></script>
  <script src="/web/admin/dav_editor.js" defer></script>
  <script src="/web/admin/app.js" defer></script>
</body>
</html>
